name: windows-quality

on:
  push:
  pull_request:

jobs:
  baseline:
    runs-on: windows-latest

    # No Qt on the runner, and every step that touches cargo builds the Qt
    # host's build script — bootstrap runs `cargo check --workspace` before the
    # quality gate is reached. Job scope, not step scope: setting it on one step
    # only moves the failure to whichever step runs first.
    env:
      NRR_SKIP_QT_HOST: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # rust-toolchain.toml is the only place the version is written.
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Bootstrap workspace
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\bootstrap.ps1

      - name: Run quality baseline
        shell: pwsh
        # The Rust gate (fmt, clippy, tests, cargo-deny) runs; the C++ Qt host
        # is skipped by the job-level switch above. Building it here would need
        # a full Qt install per run.
        run: powershell -ExecutionPolicy Bypass -File .\scripts\check.ps1 -RequireCargoDeny
