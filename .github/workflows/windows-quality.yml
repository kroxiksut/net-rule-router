name: windows-quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: windows-latest

    # The Qt host is not built here (Qt is installed for qmllint only), and
    # every step that touches cargo builds the Qt host's build script —
    # bootstrap runs `cargo check --workspace` before the quality gate is
    # reached. Job scope, not step scope: setting it on one step
    # only moves the failure to whichever step runs first.
    env:
      NRR_SKIP_QT_HOST: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # rust-toolchain.toml is the only place the version is written.
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-deny
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-deny

      - name: Bootstrap workspace
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\bootstrap.ps1

      # qmllint for the QML gate, nothing else: the Qt host stays skipped.
      # Version and action as in release.yml, so the QML is checked against
      # the Qt that ships.
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.8.3"
          host: windows
          arch: win64_msvc2022_64
          cache: true

      - name: Run quality baseline
        shell: pwsh
        # The Rust gate (fmt, clippy, tests, cargo-deny) and qmllint run; the
        # C++ Qt host is skipped by the job-level switch above.
        # -RequireQmlLint: a missing qmllint here means the Qt step broke, and
        # a gate that skips QML must not pass.
        run: powershell -ExecutionPolicy Bypass -File .\scripts\check.ps1 -RequireCargoDeny -RequireQmlLint
