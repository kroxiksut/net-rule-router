name: release

# A version tag builds every deliverable and drafts a GitHub Release holding
# them with one checksum file. The draft is published by hand, after the
# artifacts have been tried on a clean machine.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Third-party actions are pinned to commits: what this workflow builds is what
# users install. Only `attest` may sign and only `release` may write.
permissions:
  contents: read

jobs:
  # Nothing is built unless the tag names the workspace version, every action
  # is pinned to a commit and CI on the tagged commit is green.
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Self-test the guard
        run: bash scripts/tests/release-guard/run.sh

      - name: Release guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=(--tag "$GITHUB_REF_NAME"); fi
          bash scripts/release-guard.sh --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" "${tag[@]}"

  windows:
    name: windows-${{ matrix.arch }} (${{ matrix.variant }})
    needs: guard
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        variant: [full, headless]
        include:
          - arch: x64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
            qt_host: windows
            qt_arch: win64_msvc2022_64
          # Built on ARM64 itself: Qt's native ARM64 kit carries its own
          # windeployqt, which a cross-compiled kit does not.
          - arch: arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: ${{ matrix.rust_target }}

      # No build cache: what ships is built from the tagged sources alone.

      - name: Install Qt
        if: matrix.variant == 'full'
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.8.3"
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Point the Qt host at Qt
        if: matrix.variant == 'full'
        shell: bash
        run: echo "CMAKE_PREFIX_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Skip the Qt host
        if: matrix.variant == 'headless'
        shell: bash
        run: echo "NRR_SKIP_QT_HOST=1" >> "$GITHUB_ENV"

      # WiX 6 carries a maintenance-fee licence; 5.0.2 does not.
      - name: Install installer tools
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Package
        shell: pwsh
        run: |
          $variant = @()
          if ('${{ matrix.variant }}' -eq 'headless') { $variant = @('-Headless') }
          powershell -ExecutionPolicy Bypass -File .\scripts\package-windows.ps1 `
            -Arch ${{ matrix.arch }} -OutputRoot "$env:RUNNER_TEMP\dist" -Zip -Installers -Force @variant

      # The MSI is unpacked (msiexec /a), never installed: the service would
      # change the runner's own network.
      - name: Check the package contents
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\check-windows-package.ps1 `
            -Dist "$env:RUNNER_TEMP\dist" -Variant ${{ matrix.variant }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-${{ matrix.arch }}-${{ matrix.variant }}
          path: |
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/*.exe
            ${{ runner.temp }}/dist/*.msi
          if-no-files-found: error

  linux:
    name: linux-${{ matrix.arch }} (${{ matrix.variant }})
    needs: guard
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        variant: [headless, full]
        include:
          # The images are multi-arch: an ARM runner pulls their arm64 build,
          # and package-linux.sh names the packages after the machine it runs on.
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
          # Built on the oldest glibc the packages should install on: a Linux
          # binary runs on the C library it was built with and on newer ones.
          - variant: headless
            image: debian:10
            # The base package every system installs, and the archive without a GUI.
            keep: "netrulerouter_*.deb netrulerouter-[0-9]*.rpm netrulerouter-headless-*.tar.gz"
          # The oldest Debian whose own Qt is 6.6 or newer. Its base package
          # would collide with the one above, so only the GUI leaves this job.
          - variant: full
            image: debian:13
            keep: "netrulerouter-gui*.deb netrulerouter-gui*.rpm netrulerouter-[0-9]*.tar.gz"
    container: ${{ matrix.image }}
    steps:
      - name: Point Debian 10 at its archive
        if: matrix.image == 'debian:10'
        run: |
          # The image's libc comes from the security updates: without them
          # its -dev packages do not match and build-essential cannot install.
          echo 'deb http://archive.debian.org/debian buster main' > /etc/apt/sources.list
          echo 'deb http://archive.debian.org/debian-security buster/updates main' >> /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99archive

      - name: Install build tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git \
            build-essential pkg-config dpkg-dev rpm binutils file
          if [ "${{ matrix.variant }}" = full ]; then
            apt-get install -y --no-install-recommends cmake qt6-base-dev qt6-declarative-dev
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup-init by version and hash, not `curl | sh`: the release job must
      # not run a script the server can change under the same URL.
      - name: Install Rust
        run: |
          case "${{ matrix.arch }}" in
            x86_64)  sum=20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c ;;
            aarch64) sum=e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c ;;
          esac
          curl -sSfo rustup-init "https://static.rust-lang.org/rustup/archive/1.28.2/${{ matrix.arch }}-unknown-linux-gnu/rustup-init"
          echo "$sum  rustup-init" | sha256sum -c -
          chmod +x rustup-init
          channel="$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)"
          ./rustup-init -y --profile minimal --default-toolchain "$channel"
          rm rustup-init
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # package-linux.sh checks every package against
      # packaging/linux/package-contents.txt. The headless binaries must run on
      # glibc 2.28, the floor the supported systems share.
      - name: Package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          args="--build --out $RUNNER_TEMP/packages"
          [ "${{ matrix.variant }}" = headless ] && args="--headless --max-glibc 2.28 $args"
          bash scripts/package-linux.sh $args
          mkdir -p "$RUNNER_TEMP/keep"
          cd "$RUNNER_TEMP/packages"
          # Unquoted on purpose: each word is a glob.
          cp -v ${{ matrix.keep }} "$RUNNER_TEMP/keep/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ matrix.arch }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/keep/*
          if-no-files-found: error

  # A signed statement per file, kept by GitHub, that this workflow built it
  # from the tagged commit: `gh attestation verify` checks a download without
  # trusting the release page. The only job that may sign.
  attest:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*

  release:
    needs: [windows, linux, attest]
    runs-on: ubuntu-latest
    # The only job that writes, and it runs no third-party code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # One checksum file over everything the release carries, so a download
      # from any job can be checked the same way.
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- * > SHA256SUMS

      # Off until the repository variable NRR_SIGN_CHECKSUMS is "true" and the
      # secret MINISIGN_KEY (an unencrypted minisign secret key) exists; the
      # public key is then published next to the release notes.
      - name: Sign the checksums
        if: ${{ vars.NRR_SIGN_CHECKSUMS == 'true' }}
        working-directory: artifacts
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          test -n "$MINISIGN_KEY" || { echo "MINISIGN_KEY is not set"; exit 1; }
          sudo apt-get install -y --no-install-recommends minisign
          umask 077
          key="$RUNNER_TEMP/minisign.key"
          printf '%s
' "$MINISIGN_KEY" > "$key"
          minisign -S -s "$key" -m SHA256SUMS
          rm -f "$key"

      - name: Draft the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --title "NetRuleRouter $GITHUB_REF_NAME"

      - name: Keep the set when not tagged
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-set
          path: artifacts
