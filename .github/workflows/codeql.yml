name: codeql

# Started by hand after a clean local run: the analysis takes about an hour,
# and its findings are reviewed before they reach the Security tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # The only job that writes, and only its findings.
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # The QML JavaScript is left out: CodeQL cannot parse `.pragma library`.
        language: [rust, c-cpp, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
