name: linux-quality

on:
  # Other branches are checked through their pull request, not twice.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest

    # Same reason as the Windows job: the Qt host is not built here (Qt is
    # installed for qmllint only), and every cargo step would otherwise run
    # the Qt host's build script. `check.sh` also sets this itself when cmake
    # is missing, but setting it here keeps the job honest about what it does
    # NOT cover rather than relying on a fallback.
    env:
      NRR_SKIP_QT_HOST: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml is the only place the version is written.
      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Prebuilt binaries. check.sh runs the tests through nextest when present.
      - name: Install cargo-deny and cargo-nextest
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2
        with:
          tool: cargo-deny,cargo-nextest

      # qmllint for the QML gate, nothing else: the Qt host stays skipped.
      # Version and action as in release.yml, so the QML is checked against
      # the Qt that ships.
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4.4.1
        with:
          version: "6.8.3"
          host: linux
          arch: linux_gcc_64
          cache: true

      - name: Run quality baseline
        # Same gates in the same order as the Windows job: qmllint, fmt, clippy
        # with warnings denied, the full test suite, then cargo-deny.
        # --require-qmllint: a missing qmllint means the Qt step broke.
        #
        # What this job exists to catch: code that compiles on Windows but not
        # on Linux. Twice already a module landed with direct Win32 calls and no
        # `cfg` guard, and a test asserted the host OS outright — both broke the
        # Linux build and both were found only by someone running WSL by hand.
        # Enforcement tests that need root (nftables, live routes) run in the
        # privileged job below.
        run: bash scripts/check.sh --require-cargo-deny --require-qmllint

  # The `#[ignore]` tests: nftables, live routes, link and DNS observers. They
  # need root, which this throwaway runner grants through sudo.
  privileged:
    runs-on: ubuntu-latest

    env:
      NRR_SKIP_QT_HOST: "1"
      # Only the test binaries run as root; cargo, the build and its cache stay
      # with the runner user, so no root-owned file lands in `target`.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "sudo -E"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned toolchain
        id: toolchain
        shell: bash
        run: echo "channel=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install nftables
        env:
          DEBIAN_FRONTEND: noninteractive
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables

      # The same crates and thread count as `check.sh --include-privileged`:
      # one thread, because the tests share the route table and nftables.
      # `--tests` keeps rustdoc out: under `--ignored` it would compile
      # `ignore` doc examples. The pump cost is a measurement, not a check.
      - name: Run privileged tests
        run: >-
          cargo test --locked -p nrr-platform-linux -p nrr-service-runtime --tests --
          --ignored --test-threads=1
          --skip the_pump_cost_at_scale
