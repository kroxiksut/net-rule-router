[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  # Reviewed 2026-07-21 (Block D, fake-IP slice 3): zero-clause BSD used by
  # `smoltcp` (the userspace TCP/IP stack). Maximally permissive, no
  # attribution requirement, explicitly commercial-friendly.
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  # Reviewed 2026-07-17 (Block 16.HW-0717 П2): Mozilla's CA root-store data
  # shipped by `webpki-roots` (transitive of `ureq`, the launcher's daily
  # release check). Permissive data license, no copyleft, explicitly allows
  # commercial redistribution of the certificate data.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Block 16.HW-0717 (П2) — the workspace version moved to a single
# `[workspace.package]` source of truth and the internal `nrr-*` path
# dependencies dropped their redundant `version = "…"` pins (path resolution
# inside the workspace never used them). cargo-deny counts a version-less
# path dependency as a wildcard; exempt PATH deps only — crates.io wildcard
# requirements stay denied.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
