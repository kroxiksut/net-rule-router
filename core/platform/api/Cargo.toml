[package]
name = "nrr-platform-api"
version.workspace = true
edition = "2021"
rust-version = "1.94.1"
publish = false
license = "MPL-2.0"

# Neutral platform-port API. Holds the OS-agnostic port TRAIT and value-type
# DEFINITIONS that `service-runtime` codes against; the per-OS backends
# (`nrr-platform-windows`, and later `-linux`/`-macos`) `impl` these.
# HARD RULE: no OS-specific dependencies here — this crate MUST compile on every
# target (`x86_64-unknown-linux-gnu`, `aarch64-apple-darwin`, …), keeping the
# policy/mechanism seam: decision logic stays neutral, OS mechanism goes
# behind this trait.

[lib]
path = "src/lib.rs"

[dependencies]
# OS CSPRNG for the DB-MAC signing key (`key_store::generate_signing_key`).
# Cross-platform (Linux/macOS/Windows) — keeps this crate OS-neutral.
getrandom = "0.3"
# The neutral platform value-types (`types::*`: RouteEntry, WfpFilterSpec,
# …) are (de)serialised across the IPC/persistence boundary; serde is OS-neutral.
serde = { version = "1", features = ["derive"] }
# The neutral WFP session apply logic (`wfp`) emits skip/abort
# diagnostics via structured tracing spans. `tracing` is pure-Rust and OS-neutral.
tracing = "0.1"
# `snapshot` computes SHA-256 hashes of the platform state for
# idempotency/rollback; sha2 is pure-Rust and OS-neutral.
sha2 = "0.10"
# `interface_rows` neutral types + `from_wire_dto` reference the wire
# DTOs and route-role enums in nrr-shared (contracts crate, fully OS-neutral).
nrr-shared = { path = "../../../shared/contracts" }
# The neutral enforcement data-model (`enforcement`) is keyed by the
# cross-OS `UserPrincipal` (Win SID / Linux uid / macOS uid). `nrr-domain` is the
# pure decision layer and is itself OS-neutral (depends only on nrr-shared), so
# this keeps `platform → domain` — an allowed direction — with no cycle.
nrr-domain = { path = "../../domain" }
# `vm_inventory::virtualbox` reads VirtualBox's settings files, the same XML on
# every OS. Pure Rust, no dependencies, MIT OR Apache-2.0.
roxmltree = "0.21"

# `PlatformError::Errno` classifies POSIX error codes, whose numeric values
# differ between Unix targets — naming them through `libc` is what keeps the
# table right on Linux and macOS alike. Scoped to `cfg(unix)` so the crate's
# "compiles on every target" rule stays literal: Windows builds never see it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# `hosts_file` tests write a temp hosts file + exercise the mtime cache.
tempfile = "3"
# `snapshot` tests round-trip `PlatformStateSnapshot` through JSON; OS-neutral.
serde_json = "1"

[lints]
workspace = true
