[package]
name = "nrr-platform-linux"
version.workspace = true
edition = "2021"
rust-version = "1.94.1"
publish = false
license = "MPL-2.0"

# Linux backend of the `nrr-platform-api` ports. Compiles on every host so its
# pure parts are tested everywhere; consumers select it under
# `cfg(target_os = "linux")`.

[lib]
path = "src/lib.rs"

[dependencies]
nrr-platform-api = { path = "../api" }
nrr-shared = { path = "../../../shared/contracts" }
# nftables JSON API (`libnftables-json`): the typed ruleset model; `nft_apply`
# runs `nft -j -f -` itself, under a deadline and the C locale. MIT OR Apache-2.0 — deliberately NOT `libnftnl`
# (GPLv2+) or `rustables` (GPLv3+), either of which would relicense the whole
# product; running `nft` as a child process creates no derivative work. Kept as
# an unconditional dependency, not Linux-only, so the IR-to-JSON rendering is
# unit-tested on the Windows dev host too; only the apply call is Linux-gated.
nftables = "0.6"
# Same reason the Windows sibling carries it: a sweep that swallows a real
# failure silently reports a clean machine.
tracing = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
# `peer_cred.rs` needs `getsockopt(SO_PEERCRED)` / `struct ucred`
# to identify an accepted AF_UNIX IPC caller (the Linux analog of the Windows
# named-pipe token inspection). There is no stable `std` API for peer
# credentials; `libc` is the idiomatic route. MIT/Apache, allowed by policy.
# Linux-only: the module is `#[cfg(target_os = "linux")]`.
libc = "0.2"
# Reading `loginctl --output=json`. Both crates are already in the graph via
# `nftables`; declaring them directly is what lets this crate parse a documented
# JSON interface instead of hand-rolling a parser — the hand-rolled one read a
# footer line ("2 users listed.") as a user id.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The browser-history reader opens a private COPY of a browser's History
# database. Same version and bundling as the Windows reader and the stores, so
# the graph keeps one SQLite.
rusqlite = { version = "0.32", features = ["bundled"] }
# The main-link probe pins its socket to a link (`SO_BINDTODEVICE`); binding a
# source address alone does not choose the egress interface on Linux. `all`
# exposes `bind_device`; the crate is already in the graph via the service.
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
# Discovery and inventory tests read their roots from temp dirs.
tempfile = "3"
# The apply-layer tests assert on the JSON transaction the renderer produces —
# the exact bytes handed to `nft`, which is the part worth pinning.
serde_json = "1.0"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The live signal test raises `SIGTERM` at itself to prove the handler is the
# one that runs; `std` has no way to send a signal.
libc = "0.2"

[lints]
workspace = true
