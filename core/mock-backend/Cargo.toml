[package]
name = "nrr-mock-backend"
version.workspace = true
edition = "2021"
rust-version = "1.94.1"
publish = false
license = "MPL-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
nrr-domain = { path = "../domain" }
nrr-shared = { path = "../../shared/contracts" }
# Neutral platform types/logic; each OS backend only on its own OS, for the
# local adapter enumeration the preview falls back to.
nrr-platform-api = { path = "../platform/api" }
nrr-diagnostics = { path = "../diagnostics" }

[target.'cfg(windows)'.dependencies]
nrr-platform-windows = { path = "../platform/windows" }

[target.'cfg(target_os = "linux")'.dependencies]
nrr-platform-linux = { path = "../platform/linux" }

[lints]
workspace = true
