[package]
name = "nrr-ui-support"
version.workspace = true
edition = "2021"
rust-version = "1.94.1"
publish = false
license = "MPL-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
nrr-shared = { path = "../../shared/contracts" }
# The neutral system-theme port. The probe is OS mechanism and must not live in
# a UI crate; the per-OS implementations are installed by the surfaces.
nrr-platform-api = { path = "../platform/api" }

[dev-dependencies]
# Scratch directories for `ui_preferences` tests, removed on drop so nothing
# leaks into `%TEMP%`.
tempfile = "3"

[lints]
workspace = true
