[package]
name = "nrr-ipc-client"
version.workspace = true
edition = "2021"
rust-version = "1.94.1"
publish = false
license = "MPL-2.0"

# IPC client used by the GUI, tray, console and broker to talk to the
# service. Sync API + background reader thread + reconnect state machine.
#
# Runtime dependency: nrr-shared only (the wire SSOT). Anything above the
# transport belongs to the crate that uses it, or it links into every client
# binary, the console included.

[lib]
path = "src/lib.rs"

[dependencies]
nrr-shared      = { path = "../../shared/contracts" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# For contract tests: verify that the wire format the client emits is
# accepted by the production router. dev-dep only — production code in
# this crate does NOT reach into service-runtime.
nrr-service-runtime = { path = "../services/service-runtime" }
# snapshot_cache.rs unit tests use isolated temp directories.
tempfile = "3"

[target.'cfg(windows)'.dependencies]
# Direct Win32 bindings for the named-pipe client transport: CreateFileW,
# ReadFile/WriteFile against the pipe handle, OpenSCManagerW + OpenServiceW
# + QueryServiceStatusEx for service-status probe.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[lints]
workspace = true
