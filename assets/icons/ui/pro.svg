<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="pro">
  <!-- NetRuleRouter custom icon: PRO badge with rounded filled text -->
  <defs>
    <linearGradient id="nrr-grad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0" stop-color="#1EA7FF"/>
      <stop offset="1" stop-color="#8A3FFC"/>
    </linearGradient>
  </defs>
  <title>pro</title>
  <rect x="3" y="5" width="18" height="14" rx="3.4"
        fill="url(#nrr-grad)" fill-opacity="0.14"
        stroke="url(#nrr-grad)" stroke-width="2.1"/>
  <text x="12" y="15.2"
        text-anchor="middle"
        font-family="Arial Rounded MT Bold, Trebuchet MS, Segoe UI, Arial, sans-serif"
        font-size="7.4"
        font-weight="700"
        letter-spacing="0.45"
        fill="url(#nrr-grad)">PRO</text>
</svg>
