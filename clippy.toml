# Workspace Clippy configuration.
#
# The workspace lints deny `unwrap_used` and warn on `expect_used`
# (`[workspace.lints.clippy]` in Cargo.toml) to keep PRODUCTION code panic-free.
# Test code legitimately uses `unwrap()`/`expect()` to assert invariants, so we
# exempt it here rather than sprinkling `#[allow(...)]` across every `mod tests`.
# This keeps `cargo clippy --all-targets -- -D warnings` green without weakening
# the production guarantee.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
