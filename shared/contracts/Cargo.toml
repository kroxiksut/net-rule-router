[package]
name = "nrr-shared"
version.workspace = true
edition = "2021"
rust-version = "1.94.1"
publish = false
license = "MPL-2.0"

[lib]
path = "src/lib.rs"

[dependencies]
# Block 16.4: payload types and diagnostics DTOs moved into this crate as
# wire-protocol SSOT (so `nrr-ipc-client` can build typed requests without
# pulling in `nrr-diagnostics`). Hence `serde` derive is now needed here.
serde      = { version = "1", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# Used in the localization-validation tests to write transient locale files.
# `TempDir` cleans up on drop so we no longer leak `nrr-locale-test-*` dirs
# into `%TEMP%` after each `cargo test` run.
tempfile = "3"

[lints]
workspace = true
