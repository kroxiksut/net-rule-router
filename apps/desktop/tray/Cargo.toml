[package]
name = "nrr-desktop-tray"
version.workspace = true
edition = "2021"
rust-version = "1.94.1"
publish = false
license = "MPL-2.0"

# A library: `nrr-launcher` builds `NetRuleRouterTray.exe`, so a binary here
# would collide with it in `target/<profile>/`. This crate holds
# `write_qt_tray_context_file` and the types the launcher calls it with.
[lib]
name = "nrr_desktop_tray"
path = "src/lib.rs"

[dependencies]
nrr-ui-support = { path = "../../../core/ui-support" }
nrr-shared = { path = "../../../shared/contracts" }
# The coordination directory and the private-file creator — the same exception
# CLAUDE.md names for the desktop surfaces: platform-api owns the ONE
# declaration of where runtime state lives.
nrr-platform-api = { path = "../../../core/platform/api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
