[package]
name = "nrr-desktop-gui"
version.workspace = true
edition = "2021"
rust-version = "1.94.1"
publish = false
license = "MPL-2.0"

# A library: `nrr-launcher` builds `NetRuleRouter.exe` and owns the process,
# so a second binary here would collide with it in `target/<profile>/`. This
# crate holds the QML context emitter, launch-request parser and prefs
# round-trip the launcher calls.
[lib]
name = "nrr_desktop_gui"
path = "src/lib.rs"

[dependencies]
nrr-application = { path = "../../../core/application" }
nrr-ui-support = { path = "../../../core/ui-support" }
nrr-shared = { path = "../../../shared/contracts" }
# "Open logs folder" must land in the directory the service actually writes to;
# the roots are declared once in the platform layer, not re-derived here.
nrr-platform-api = { path = "../../../core/platform/api" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints]
workspace = true
