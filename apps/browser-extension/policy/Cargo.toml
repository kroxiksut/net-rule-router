[package]
name = "nrr-browser-policy"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
dbg_macro = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

